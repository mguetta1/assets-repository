apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-app-source
  labels:
    helm.sh/chart: quickstart-openshift-pipelines-0.1.0
    app.kubernetes.io/name: hello-app
    app.kubernetes.io/instance: hello-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "arch1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-app-config
  labels:
    helm.sh/chart: quickstart-openshift-pipelines-0.1.0
    app.kubernetes.io/name: hello-app
    app.kubernetes.io/instance: hello-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "arch1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
