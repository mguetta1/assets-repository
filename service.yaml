apiVersion: v1
kind: Service
metadata:
  name: petclinic
  labels:
    helm.sh/chart: quickstart-java-service-0.2.0
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/archetype: "arch1"
  annotations:
    konveyor.io/source-repository: https://github.com/spring-projects/spring-petclinic
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/instance: petclinic
